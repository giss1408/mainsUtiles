[project]
name = "petitgombo-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework",
    "drf-spectacular",
    "django-environ",
    "psycopg[binary]",
    "redis",
    "celery",
    "packaging",  # imported by celery's Redis transport but not declared by it
    "phonenumbers",
    "PyJWT",
    "cryptography",
    "gunicorn",
    "whitenoise",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-django", "freezegun", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
