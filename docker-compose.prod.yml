# Production stack. Start with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# See docs/deployment.md.
name: petitgombo-prod

x-backend: &backend
  build: ./backend
  image: petitgombo-backend
  restart: unless-stopped
  environment: &backend-env
    DEBUG: "0"
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.prod}
    # localhost is for the container healthcheck; the public never reaches the app directly.
    ALLOWED_HOSTS: ${SITE_DOMAIN:?set SITE_DOMAIN in .env.prod},localhost
    CSRF_TRUSTED_ORIGINS: https://${SITE_DOMAIN}
    TRUST_PROXY_HEADERS: "1"
    FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env.prod}
    VERIFICATION_STORAGE_DIR: /data/verification
    DATABASE_URL: postgres://petitgombo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@db:5432/petitgombo
    REDIS_URL: redis://redis:6379/0
    OFFICIAL_WHATSAPP_NUMBER: ${OFFICIAL_WHATSAPP_NUMBER:-}
    ALLOWED_PHONE_REGIONS: ${ALLOWED_PHONE_REGIONS:-CI}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    command: ["gunicorn", "config.wsgi", "--bind", "0.0.0.0:8000", "--workers", "3"]
    volumes:
      # Encrypted identity photos. Only the web service reads or writes them.
      - verification_data:/data/verification
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel", "info"]

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: petitgombo
      POSTGRES_USER: petitgombo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first start PostgreSQL briefly runs on its socket only, before it is ready.
      test: ["CMD-SHELL", "pg_isready -U petitgombo -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  verification_data:
  caddy_data:
  caddy_config:
