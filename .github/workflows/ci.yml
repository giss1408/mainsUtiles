name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: petitgombo
          POSTGRES_USER: petitgombo
          POSTGRES_PASSWORD: petitgombo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U petitgombo" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e 'backend[dev]'
      - run: ruff check backend
      - run: pytest
        working-directory: backend
      - run: docker build -t petitgombo-backend backend
      - run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.2"
      - name: Analyze and test every Dart package
        run: |
          for dir in mobile/packages/petitgombo_core mobile/apps/jobber mobile/apps/householder mobile/apps/staff; do
            if [ -d "$dir" ]; then
              (cd "$dir" && flutter pub get && flutter analyze && flutter test)
            fi
          done
