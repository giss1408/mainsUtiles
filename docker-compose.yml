# Development services only. Production uses docker-compose.prod.yml.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: petitgombo
      POSTGRES_USER: petitgombo
      POSTGRES_PASSWORD: petitgombo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petitgombo"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
