name: petitgombo_core
description: Shared code for the petitGombo apps - API client, device identity, enrolment.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  uuid: ^4.4.0
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-400.ttf
          weight: 400
        - asset: fonts/Inter-500.ttf
          weight: 500
        - asset: fonts/Inter-600.ttf
          weight: 600
        - asset: fonts/Inter-700.ttf
          weight: 700
